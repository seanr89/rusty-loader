[package]
name = "rusty-loader"
version = "0.1.0"
edition = "2021"
authors = ["Sean Rafferty"]
description = "High-performance, concurrent API load testing CLI written in Rust"

[[bin]]
name = "rusty-loader"
path = "src/main.rs"

[[bin]]
name = "api-load-tester"
path = "src/main.rs"

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# CLI Parsing & UX
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = { version = "0.17", features = ["tokio"] }
comfy-table = "7.1"
colored = "2.1"

# Telemetry & Metrics
hdrhistogram = "7.5"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling & System Utilities
anyhow = "1.0"
thiserror = "1.0"
libc = "0.2"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
tempfile = "3.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
