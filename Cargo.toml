[package]
name = "rusty-loader"
version = "0.2.0"
edition = "2021"
authors = ["Sean Rafferty"]
description = "High-performance, concurrent API load testing CLI written in Rust"

[[bin]]
name = "rusty-loader"
path = "src/main.rs"

[[bin]]
name = "api-load-tester"
path = "src/main.rs"

[features]
default = ["gui", "desktop"]
gui = ["dep:axum", "dep:tokio-stream", "dep:futures-util", "dep:getrandom"]
desktop = ["gui", "dep:tao", "dep:wry", "dep:muda", "dep:rfd"]

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tower-layer = "0.3"
tower-service = "0.3"

# Embedded Web GUI Server
axum = { version = "0.8", optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
futures-util = { version = "0.3", optional = true }
getrandom = { version = "0.4", optional = true }

# CLI Parsing & UX
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = { version = "0.17", features = ["tokio"] }
comfy-table = "7.1"
colored = "2.1"

# Telemetry & Metrics
hdrhistogram = "7.5"
chrono = { version = "0.4", default-features = false, features = ["now", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.4"
pdf-writer = "0.15"

# Error Handling & System Utilities
anyhow = "1.0"
thiserror = "1.0"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tao = { version = "0.38", default-features = false, features = ["rwh_06"], optional = true }
wry = { version = "0.57", default-features = false, optional = true }
muda = { version = "0.21", default-features = false, optional = true }
rfd = { version = "0.18", default-features = false, optional = true }

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
tempfile = "3.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
