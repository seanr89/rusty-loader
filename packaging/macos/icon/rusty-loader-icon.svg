<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Soft Apple HIG tile shadow within the 100px margin -->
    <filter id="tileShadow" x="-15%" y="-12%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.42"/>
    </filter>

    <!-- Subtle glow for primary telemetry pulse & beacon -->
    <filter id="cyanGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="amberGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Base slate squircle gradient -->
    <linearGradient id="tileBg" x1="120" y1="100" x2="904" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="52%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172540"/>
    </linearGradient>

    <!-- Ambient top-left cyan bloom -->
    <radialGradient id="topGlow" cx="26%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#0ea5e9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient bottom-right emerald/amber bloom -->
    <radialGradient id="crestGlow" cx="76%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Crisp glass rim stroke -->
    <linearGradient id="rimStroke" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.22"/>
    </linearGradient>

    <!-- Throughput column gradients -->
    <linearGradient id="barCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="barEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Emerald baseline area fill -->
    <linearGradient id="emeraldArea" x1="0" y1="480" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Cyan primary curve stroke -->
    <linearGradient id="pulseStroke" x1="150" y1="680" x2="860" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="48%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Rust copper/amber burst gradient -->
    <linearGradient id="amberBurst" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <!-- Main Apple HIG squircle base -->
  <g filter="url(#tileShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#tileBg)"/>
  </g>

  <!-- Clipped interior artwork -->
  <g clip-path="url(#tileClip)">
    <!-- Ambient atmospheric gradients -->
    <rect x="100" y="100" width="824" height="824" fill="url(#topGlow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#crestGlow)"/>

    <!-- Subtle telemetry chart gridlines -->
    <g stroke="#94a3b8" stroke-opacity="0.11" stroke-width="2">
      <line x1="100" y1="265" x2="924" y2="265"/>
      <line x1="100" y1="415" x2="924" y2="415"/>
      <line x1="100" y1="565" x2="924" y2="565"/>
      <line x1="100" y1="715" x2="924" y2="715"/>
      <line x1="265" y1="100" x2="265" y2="924"/>
      <line x1="430" y1="100" x2="430" y2="924"/>
      <line x1="595" y1="100" x2="595" y2="924"/>
      <line x1="760" y1="100" x2="760" y2="924"/>
    </g>

    <!-- Precision high-throughput gauge arc accent (upper quadrant) -->
    <path d="M 225 460 A 305 305 0 0 1 795 390" fill="none" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 20"/>
    <path d="M 650 225 A 305 305 0 0 1 795 390" fill="none" stroke="#f59e0b" stroke-opacity="0.34" stroke-width="10" stroke-linecap="round"/>

    <!-- 5 ascending translucent throughput / VU columns -->
    <g>
      <rect x="172" y="650" width="76" height="280" rx="18" fill="url(#barCyan)"/>
      <rect x="294" y="575" width="76" height="355" rx="18" fill="url(#barEmerald)"/>
      <rect x="416" y="495" width="76" height="435" rx="18" fill="url(#barCyan)"/>
      <rect x="538" y="405" width="76" height="525" rx="18" fill="url(#barEmerald)"/>
      <rect x="660" y="330" width="76" height="600" rx="18" fill="url(#barCyan)"/>
    </g>

    <!-- Secondary emerald p50 latency baseline wave + area fill -->
    <path d="M 92 770 C 205 752, 278 655, 392 668 C 495 680, 565 538, 695 520 C 785 508, 845 452, 932 418 L 932 930 L 92 930 Z"
          fill="url(#emeraldArea)"/>
    <path d="M 92 770 C 205 752, 278 655, 392 668 C 495 680, 565 538, 695 520 C 785 508, 845 452, 932 418"
          fill="none" stroke="#10b981" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/>

    <!-- Primary bold cyan throughput/latency surge curve -->
    <path d="M 136 695 L 285 695 L 368 485 L 458 632 L 580 412 L 664 466 L 788 268"
          fill="none" stroke="#38bdf8" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.22" filter="url(#cyanGlow)"/>
    <path d="M 136 695 L 285 695 L 368 485 L 458 632 L 580 412 L 664 466 L 788 268"
          fill="none" stroke="url(#pulseStroke)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Inner specular highlight on cyan surge curve -->
    <path d="M 136 695 L 285 695 L 368 485 L 458 632 L 580 412 L 664 466 L 788 268"
          fill="none" stroke="#bae6fd" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.48"/>

    <!-- Rust-inspired copper/amber high-concurrency bolt badge in top-left quadrant -->
    <g filter="url(#amberGlow)">
      <path d="M 304 196 L 222 318 L 286 318 L 264 416 L 356 286 L 290 286 Z"
            fill="url(#amberBurst)" stroke="#fef3c7" stroke-width="6" stroke-linejoin="round" stroke-opacity="0.85"/>
    </g>

    <!-- Radiant live telemetry beacon at the surge crest -->
    <g filter="url(#amberGlow)">
      <circle cx="788" cy="268" r="52" fill="#f59e0b" fill-opacity="0.26"/>
    </g>
    <circle cx="788" cy="268" r="34" fill="#0f172a" stroke="#fbbf24" stroke-width="12"/>
    <circle cx="788" cy="268" r="16" fill="#fef3c7"/>
  </g>

  <!-- Crisp inner glass rim border -->
  <rect x="103" y="103" width="818" height="818" rx="182" ry="182" fill="none" stroke="url(#rimStroke)" stroke-width="6"/>
</svg>
